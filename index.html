<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
<title>Cahier de Classe — Gestion Classe</title>
<meta name="description" content="Application de gestion de classe : élèves, notes, présences, bulletins, fin d'année." />
<meta name="theme-color" content="#1F3A2E" />

<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon-192.png" />
<link rel="apple-touch-icon" href="icon-192.png" />

<link rel="stylesheet" href="styles.css" />
<style>
  body { margin: 0; font-family: Georgia, 'Times New Roman', serif; }
  .font-display { font-family: Georgia, 'Times New Roman', serif; font-weight: 600; }
  .font-mono-num { font-family: 'Courier New', monospace; }
  .font-sans { font-family: -apple-system, Roboto, Helvetica, Arial, sans-serif; }
  .fille { color: #B23A2E; }
  .garcon { color: #2B2118; }
  @media print {
    body * { visibility: hidden; }
    .print-area, .print-area * { visibility: visible; }
    .print-area { position: absolute; top: 0; left: 0; width: 100%; padding: 0; }
    .no-print { display: none !important; }
  }
</style>
</head>
<body>
  <div id="root"></div>

  <script src="react.production.min.js"></script>
  <script src="react-dom.production.min.js"></script>
  <script src="app.min.js"></script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
