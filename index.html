<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
<title>Cahier de Classe — Gestion Classe</title>
<meta name="description" content="Application de gestion de classe : élèves, notes, présences, bulletins, fin d'année." />
<meta name="theme-color" content="#1F3A2E" />

<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon-192.png" />
<link rel="apple-touch-icon" href="icon-192.png" />

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Lora:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap');
  body { margin: 0; }
  .font-display { font-family: 'Lora', serif; }
  .font-mono-num { font-family: 'JetBrains Mono', monospace; }
  .font-sans { font-family: 'Inter', sans-serif; }
  .fille { color: #B23A2E; }
  .garcon { color: #2B2118; }
  @media print {
    body * { visibility: hidden; }
    .print-area, .print-area * { visibility: visible; }
    .print-area { position: absolute; top: 0; left: 0; width: 100%; padding: 0; }
    .no-print { display: none !important; }
  }
</style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" data-presets="react" src="app.jsx"></script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
